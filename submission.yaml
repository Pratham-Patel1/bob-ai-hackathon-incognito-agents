submission:
  title: "SupplyChainOS — AI-Powered Supply Chain Resilience & Digital Twin Control Tower"                           # REQUIRED — Project display name, e.g., "SmartOps Dashboard"

  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
   Supply chain disruptions — weather events, port strikes, geopolitical crises —
   cascade across hundreds of active shipments in ways that are impossible to
   track manually. Fleet assets (trucks, containers, vessels) sit idle while
   other routes are overloaded. Cold chain shipments (vaccines, perishables)
   are especially vulnerable — a single temperature excursion across any leg
   can spoil a $500K+ cargo, but breaches are only discovered at delivery when
   it is too late.

  solution_summary: >
    SupplyChainOS is an AI-powered resilience platform and Digital Twin control tower
    that proactively detects supply chain disruptions, predicts transit delays using Machine
    Learning, detects cold-chain sensor excursions, simulates what-if multi-modal corridors,
    and synthesizes explainable action recommendations with human-in-the-loop approval governance.

  key_features:
    - "Geospatial Digital Twin Control Tower with blast-radius disruption detection"
    - "Predictive ML transit delay estimation combined with IoT cold-chain sensor anomaly tracking"
    - "In-memory What-If digital twin simulation studio comparing baseline vs alternative corridors"
    - "Autonomous AI recommendation synthesis with human-in-the-loop (HITL) approval gates"
    - "FastMCP Server integration for IBM Bob and AI copilot conversational tool execution"

  tech_stack:
    languages: ["Python", "TypeScript", "SQL", "JavaScript"]
    frameworks: ["Next.js 14", "React 18", "FastAPI", "SQLAlchemy", "scikit-learn", "Pydantic v2"]
    ibm_technologies: ["IBM Bob", "Model Context Protocol (MCP)"]
    databases: ["PostgreSQL 16", "Async SQLite"]
    other: ["Docker", "Docker Compose", "pytest", "Lucide Icons"]

  what_we_are_most_proud_of: >
    The seamless integration between the 10 intelligence engines, FastMCP tool-calling copilot,
    and modern Next.js 14 Control Tower dashboard—enabling operators to prevent hundreds of
    thousands of dollars in spoiled pharma vaccines and delay penalties with explainable AI.

  known_limitations: >
    IoT cold-chain temperature telemetry currently utilizes high-frequency sensor streaming
    simulations; production deployment supports direct hardware cellular MQTT ingestion.

