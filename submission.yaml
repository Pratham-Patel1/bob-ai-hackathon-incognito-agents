submission:
  title: "SupplyChainOS — AI-Powered Supply Chain Resilience & Digital Twin Control Tower"

  problem_statement: >
    Supply-chain disruptions — weather events, port strikes, geopolitical crises —
    cascade across hundreds of active shipments in ways that are impossible to
    track manually. Fleet assets (trucks, containers, vessels) sit idle while
    other routes are overloaded. Cold-chain shipments (vaccines, perishables)
    are especially vulnerable — a single temperature excursion across any leg
    can spoil a $500K+ cargo, but breaches are only discovered at delivery when
    it is too late.

  solution_summary: >
    SupplyChainOS is an AI-powered supply chain resilience platform and Digital
    Twin Control Tower. It detects disruptions in real time, scores shipment risk
    using deterministic rules and a trained RandomForest ML model, monitors
    cold-chain temperature excursions, identifies idle/redeployable fleet assets,
    optimizes alternative routes, recommends carrier alternatives, and simulates
    what-if scenarios via an in-memory Digital Twin. All AI decisions are governed
    through a human-in-the-loop approval workflow backed by an immutable audit trail.
    A local MCP-driven Bob Copilot enables natural-language operator queries against
    live backend data.

  key_features:
    - "Disruption Intelligence: real-time geographic + route disruption detection with cascade impact scoring across fleet and carrier graphs"
    - "AI Risk Scoring: deterministic multi-factor risk engine + RandomForest ML model with explainable reasoning factors per shipment"
    - "Digital Twin Simulation: in-memory what-if scenario modeling comparing baseline vs disrupted state without mutating operational data"
    - "Human-in-the-Loop Governance: 5-state recommendation lifecycle with human approval gate, actor recording, and immutable audit trail"
    - "Bob Copilot (MCP): natural-language AI assistant dispatching structured tool calls via local Model Context Protocol server to live backend data"

  tech_stack:
    languages: ["Python 3.11", "TypeScript"]
    frameworks: ["FastAPI", "Next.js 14 (App Router)", "SQLAlchemy (async)", "Pydantic v2"]
    ibm_technologies: ["IBM Bob Copilot (local MCP integration)"]
    databases: ["PostgreSQL 16"]
    other: ["Docker", "Docker Compose", "scikit-learn (RandomForest)", "Leaflet Maps", "Recharts", "MCP (Model Context Protocol)"]

  what_we_are_most_proud_of: >
    The complete end-to-end AI governance pipeline: a disruption event triggers
    deterministic + ML risk scoring, generates an explainable recommendation with
    structured reasoning factors, routes to a human approval gate, and records every
    AI decision to an immutable audit trail — all in one cohesive system. The Digital
    Twin lets operators safely simulate worst-case scenarios without touching
    operational state. The Bob Copilot MCP integration lets operators ask natural-
    language questions and receive structured, explainable answers backed by live data.

  known_limitations: >
    Authentication uses a plain actor string (no OAuth/OIDC — development mode).
    RandomForest trained on synthetic supply-chain data (realistic but not production).
    Cascade analysis limited to 2nd-order effects. Route optimization uses Haversine
    distance without live OSRM/mapping. Bob Copilot runs in local MCP mode without
    external watsonx cloud credentials. Database uses development credentials with
    exposed port (not production-hardened).

